# Inert template — copy to .github/workflows/tests.yml to activate.
name: tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: OpenAPI coverage
        if: hashFiles('specs/*.json') != ''
        run: for spec in specs/*.json; do node scripts/openapi-tool.mjs coverage "$spec" --services src/main/java/com/example/qa/api/services; done
      - name: Test-suite audit (no blocking findings)
        run: node scripts/audit-suite.mjs . --fail-on block
      - name: Tests
        run: mvn -B test -Dgroups=smoke
        env:
          TEST_ENV: staging
          API_KEY: ${{ secrets.API_KEY }}
      - name: Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
