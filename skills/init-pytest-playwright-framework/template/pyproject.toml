[project]
name = "__PROJECT_NAME__"
version = "0.1.0"
description = "UI and API test automation: pytest + Playwright + httpx, composition-first (see CLAUDE.md)"
requires-python = ">=3.12"
dependencies = [
    "playwright==1.64.0",
    "pytest==9.1.1",
    "pytest-playwright==0.10.0",
    "pytest-xdist==3.8.0",
    "pytest-repeat==0.9.4",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "jsonschema==4.26.0",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = ["ruff==0.17.0", "mypy==2.4.0", "types-jsonschema==4.26.0.20261006"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "P0: business-critical",
    "P1: high priority",
    "P2: medium priority",
    "smoke: fast confidence subset",
    "case(id): test-case id, e.g. TC-TODO-001",
    "requirement(id): acceptance criterion or source the test verifies",
    "metamorphic: checks a relation between two reads or runs (derived values, action + inverse), not a fixed oracle",
    "sentinel: known-false expectation under xfail(strict=True); the run goes red if it ever passes",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "RET", "ARG", "TID", "N", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Audit rules enforced in the editor (see scripts/audit-suite.mjs). Allowed inside src/ (per-file-ignores below).
"time.sleep".msg = "R-NO-SLEEP: wait on a real signal (expect, eventually), never a fixed sleep."
"playwright".msg = "R-RAW-UI-IN-TEST: reach the UI through page-object fixtures, not Playwright directly."
"httpx".msg = "R-RAW-HTTP-IN-TEST: call the API through a service fixture, not httpx directly."
"requests".msg = "R-RAW-HTTP-IN-TEST: call the API through a service fixture."

[tool.ruff.lint.per-file-ignores]
"src/**" = ["TID251"]
"conftest.py" = ["TID251"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
