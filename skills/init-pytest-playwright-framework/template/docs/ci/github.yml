# Example GitHub Actions workflow — copy to .github/workflows/tests.yml when ready.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      API_DOMAIN: ${{ vars.API_DOMAIN }}
      API_KEY: ${{ secrets.API_KEY }}
      PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: uv sync
      - run: uv run playwright install --with-deps chromium
      - name: Static checks (fast, before the browser)
        run: uv run ruff check . && uv run ruff format --check . && uv run mypy
      - name: Test-suite audit
        run: node scripts/audit-suite.mjs . --fail-on block
      - name: Tests (retries off)
        run: uv run pytest -n 4 --junitxml=test-results/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
