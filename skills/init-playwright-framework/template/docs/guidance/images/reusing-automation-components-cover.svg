<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Reusing automation components across projects</title>
<desc>A layered diagram: one design system feeds a shared automation element package, which is consumed by three separate projects that each keep their own selector config, page objects, and tests.</desc>
<defs>
<marker id="arrowDown" markerWidth="9" markerHeight="9" refX="4.5" refY="7" orient="auto">
<path d="M0,0 L9,0 L4.5,8 Z" fill="#64748b"/>
</marker>
</defs>

<rect width="1200" height="630" fill="#0f172a"/>

<text x="600" y="66" text-anchor="middle" font-size="38" font-weight="700" fill="#f8fafc" font-family="Arial, sans-serif">Reusing Automation Components Across Projects</text>
<text x="600" y="102" text-anchor="middle" font-size="19" fill="#94a3b8" font-family="Arial, sans-serif">Share the vocabulary, not the sentences</text>

<!-- Design system -->
<rect x="330" y="136" width="540" height="62" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
<text x="600" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc" font-family="Arial, sans-serif">Design System</text>
<text x="600" y="187" text-anchor="middle" font-size="13" fill="#94a3b8" font-family="Arial, sans-serif">Input · Dropdown · DatePicker · Table</text>

<line x1="600" y1="198" x2="600" y2="232" stroke="#64748b" stroke-width="2" marker-end="url(#arrowDown)"/>
<text x="618" y="222" font-size="12" fill="#64748b" font-family="Arial, sans-serif">same DOM everywhere</text>

<!-- Shared package -->
<rect x="150" y="242" width="900" height="110" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
<text x="600" y="273" text-anchor="middle" font-size="19" font-weight="700" fill="#38bdf8" font-family="monospace">@org/pw-elements</text>
<text x="600" y="300" text-anchor="middle" font-size="13" fill="#cbd5e1" font-family="Arial, sans-serif">BaseControl · Clickable · Editable</text>
<text x="600" y="322" text-anchor="middle" font-size="13" fill="#cbd5e1" font-family="Arial, sans-serif">Input · CheckBox · Dropdown · DatePicker · Table · Form · Modal</text>
<text x="600" y="343" text-anchor="middle" font-size="12" fill="#64748b" font-family="Arial, sans-serif">selectors injected, not hardcoded</text>

<line x1="300" y1="352" x2="300" y2="410" stroke="#64748b" stroke-width="2" marker-end="url(#arrowDown)"/>
<line x1="600" y1="352" x2="600" y2="410" stroke="#64748b" stroke-width="2" marker-end="url(#arrowDown)"/>
<line x1="900" y1="352" x2="900" y2="410" stroke="#64748b" stroke-width="2" marker-end="url(#arrowDown)"/>

<!-- Projects -->
<rect x="150" y="420" width="300" height="130" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
<text x="300" y="450" text-anchor="middle" font-size="17" font-weight="700" fill="#f8fafc" font-family="Arial, sans-serif">Project A</text>
<text x="300" y="477" text-anchor="middle" font-size="12" fill="#4ade80" font-family="monospace">.input · .checkbox</text>
<text x="300" y="503" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="Arial, sans-serif">page objects · services</text>
<text x="300" y="524" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="Arial, sans-serif">test data · env config</text>

<rect x="470" y="420" width="260" height="130" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
<text x="600" y="450" text-anchor="middle" font-size="17" font-weight="700" fill="#f8fafc" font-family="Arial, sans-serif">Project B</text>
<text x="600" y="477" text-anchor="middle" font-size="12" fill="#4ade80" font-family="monospace">.form-field</text>
<text x="600" y="503" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="Arial, sans-serif">page objects · services</text>
<text x="600" y="524" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="Arial, sans-serif">test data · env config</text>

<rect x="750" y="420" width="300" height="130" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
<text x="900" y="450" text-anchor="middle" font-size="17" font-weight="700" fill="#f8fafc" font-family="Arial, sans-serif">Project C</text>
<text x="900" y="477" text-anchor="middle" font-size="12" fill="#4ade80" font-family="monospace">.ds-input · .ds-select</text>
<text x="900" y="503" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="Arial, sans-serif">page objects · services</text>
<text x="900" y="524" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="Arial, sans-serif">test data · env config</text>

<text x="600" y="592" text-anchor="middle" font-size="14" fill="#64748b" font-family="Arial, sans-serif">One shared vocabulary above the line — each project keeps its own dialect and its own screens below it</text>
</svg>
