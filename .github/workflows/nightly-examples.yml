name: Nightly examples

# Re-earns the README's "verified on TodoMVC and Petstore" claim every night: each stack's example suite
# (skills/test-script-writer/examples/<stack>/) is copied over a fresh scaffold of its template and run against the
# public demo apps — 3 repeats in parallel, the sentinel must fail, can-fail.mjs must kill every mutant.
# When this goes red, the claim is stale until it is green again.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-ts:
    name: Playwright / TypeScript examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash skills/test-script-writer/examples/playwright-ts/run-examples.sh

  selenium-java:
    name: Selenium / Java examples
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: browser-actions/setup-chrome@v1
      - run: bash skills/test-script-writer/examples/selenium-java/run-examples.sh

  pytest-playwright:
    name: pytest / Python examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@v5
      - run: bash skills/test-script-writer/examples/pytest-playwright/run-examples.sh
